<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <title>Continuum</title>
  <link rel="preload" href="/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="wallpaper" aria-hidden="true"><img alt="" decoding="async"><img class="clear" alt="" decoding="async"></div>
  <canvas id="motif" aria-hidden="true"></canvas>
  <header class="bar">
    <a href="/" class="brand" data-nav="today">Continuum</a>
  </header>
  <button type="button" id="look" class="look" aria-label="Pause and look at the picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Look</button>
  <main id="view" aria-live="polite"><p class="muted center">Loading…</p></main>
  <nav id="rail" class="rail" aria-label="Parts of this idea" hidden></nav>
  <!-- The constant menu: this card's own links (filled in per card), then the four tabs. -->
  <div class="dock">
    <div id="docklinks" class="dock-links"></div>
    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab" data-nav="today">Today</button>
      <button type="button" class="tab" data-nav="practice">Practice</button>
      <button type="button" class="tab" data-nav="journal">Journal</button>
      <button type="button" class="tab" data-nav="review">Review</button>
      <button type="button" class="tab" data-nav="gallery">Gallery</button>
    </nav>
  </div>
</body>
</html>
